name: Validate Zensical site

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  zensical-build:
    name: zensical-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build site
        run: zensical build --clean --strict
