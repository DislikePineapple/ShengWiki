site_name: ShengWiki
site_url: https://dislikepineapple.github.io/ShengWiki/

nav:
  - 序言: index.md
  - 工具箱: 
    - Markdown: data/Toolkits/Markdown.md
    - Git: data/Toolkits/Git.md
    - Latex: data/Toolkits/Latex.md
    - Vim: data/Toolkits/Vim.md
    - VSCode: data/Toolkits/VSCode.md
    - MKDocs: data/Toolkits/MKDocs.md
    - 双拼: data/Toolkits/DoublePinyin.md

theme:
  name: material
  variant: classic
  language: zh
  palette:
    scheme: default
    primary: custom
    accent: custom

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
